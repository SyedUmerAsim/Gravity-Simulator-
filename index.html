<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas" width="500" height="600"></canvas>
    <div id="statistics">Statistics</div>
    <button id="dropfromtop" onclick="dropfromtop()">Drop from Top</button>

    <button id="planetshow">Show/hide planets?</button>
    <div id="buttonbox">
        <button id="Earthgravity" onclick="selectEarthgravity()">Earth Gravity</button>
        <button id="Moongravity" onclick="selectMoongravity()">Moon Gravity</button>
        <button id="MercuryMarsgravity" onclick="selectMercuryMarsgravity()">Mercury/Mars Gravity</button>
        <button id="VenusUranusgravity" onclick="selectVenusUranusgravity()">Venus/Uranus Gravity</button>
        <button id="Jupitergravity" onclick="selectJupitergravity()">Jupiter Gravity</button>
        <button id="Saturngravity" onclick="selectSaturngravity()">Saturn Gravity</button>
        <button id="Neptunegravity" onclick="selectNeptunegravity()">Neptune Gravity</button>
        <button id="Sungravity" onclick="selectSungravity()">Sun Gravity</button>
    </div>
    <div id="statinfo">
        <div id="stat_location"><span class="underline">Location:</span>  Earth</div>
        <div id="stat_gravity"><span class="underline">Gravity:</span> 9.8 m/s²</div>
    </div>

    <input type="checkbox" id="measurecheck">
    <label for="measurecheck">see height measurements?</label>
    
    <div id="heightmeasure">
        <div>---10 meters</div>
        <div>---5 meters</div>
    </div>
    
    <script src="mainfunctioning.js"></script>
    <script src="deepfunctioning.js"></script>
</body>
</html>
