<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Simulator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas" width="500" height="600"></canvas>
    <div id="statistics">Statistics</div>
    <button id="dropfromtop" onclick="dropfromtop()">Drop from Top</button>
    <div id="buttonbox">
        <button id="Earthgravity" onclick="selectEarthgravity()">Earth Gravity</button>
        <button id="Moongravity" onclick="selectMoongravity()">Moon Gravity</button>
        <button id="MercuryMarsgravity" onclick="selectMercuryMarsgravity()">Mercury/Mars Gravity</button>
        <button id="Venusgravity" onclick="selectVenusgravity()">Venus Gravity</button>
    </div>
    <div id="statinfo">
        <div id="stat_location"><span class="underline">Location:</span>  Earth</div>
        <div id="stat_gravity"><span class="underline">Gravity:</span> 9.8 m/s²</div>
    </div>

    
    <script src="mainfunctioning.js"></script>
    <script src="deepfunctioning.js"></script>
</body>
</html>
